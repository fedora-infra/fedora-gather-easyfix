<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CI status</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="static/css/font-awesome-4.7.0/css/font-awesome.min.css"
      media="screen"
    />
  </head>
  <body>
    <div class="container-fluid">
      <h1 class="mb-5">CI status</h1>

      {% for group, projects in project_groups.items() %} {% if group %}
      <h2
        class="text-capitalize mt-{{ '4' if loop.first else '5' }}"
        id="{{ group }}"
      >
        <i class="fa fa-users"></i>
        {{ group }}
        <a class="anchor-link" href="#{{ group }}"
          ><i class="fa fa-link"></i
        ></a>
      </h2>
      <table class="table table-striped table-hover">
        {% for project in projects %} {% if project.workflows %}
        <tr>
          <th scope="row">
            <a href="{{ project.url }}">{{ project.repo_name }}</a>
          </th>
          <td>
            {% for workflow in project.workflows %}
            <a
              href="{{ workflow.html_url }}"
              title="{{ workflow.name }}"
              class="ms-2"
              ><img alt="{{ workflow.name }}" src="{{ workflow.badge_url }}"
            /></a>
            {% endfor %}
          </td>
        </tr>
        {% endif %} {% endfor %}
      </table>
      {% endif %} {% endfor %}
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
